name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          metadata = tomllib.loads((root / 'pyproject.toml').read_text())
          version = metadata['project']['version']
          module = ast.parse((root / 'src/vanillasort/__init__.py').read_text())
          api_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)
          )
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          assert api_version == version
          PY
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install --upgrade "torch>=2.7.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[dev]"
      - name: Build distributions and validate metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vanillasort
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
